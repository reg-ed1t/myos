name: Build OS Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install NASM and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y make nasm xorriso grub-pc-bin

    - name: Setup i386-elf Toolchain
      uses: lordmilko/set-up-i386-elf-toolchain@v1

    - name: Build OS Kernel
      run: make

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: os-build-artifact
        path: |
          build/
          *.iso
          *.bin
          *.elf
